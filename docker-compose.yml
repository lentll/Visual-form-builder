services:
  form-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: form-builder:latest
    container_name: form-builder
    restart: unless-stopped
    ports:
      - "8080:3000"     # 宿主机 8080 -> 容器 3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # SQLite 数据库持久化（如使用 SQLite）
    # volumes:
    #   - ./data:/app/data
