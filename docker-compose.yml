services:
  form-builder:
    # ── 方式一：拉取远程多架构镜像（推荐，默认）──
    image: ghcr.io/lentll/form-builder:latest

    # ── 方式二：本地源码构建（需要改代码时，注释上面的 image 并取消下面注释）──
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: form-builder
    restart: unless-stopped
    ports:
      - "8080:3000"     # 宿主机 8080 -> 容器 3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # SQLite 数据库持久化（命名卷，Docker 自动管理）
      - form-builder-data:/app/data
      # 上传文件持久化（按需启用）
      # - ./uploads:/app/uploads

volumes:
  form-builder-data:
