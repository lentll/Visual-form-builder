# ─────────────────────────────────────────────
# 可视化表单系统 — Nginx 配置
# 纯前端 SPA：静态资源服务 + 路由回退 + gzip + 缓存
# ─────────────────────────────────────────────

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # 静态资源根目录（Dockerfile 中 COPY dist 到此处）
    root   /usr/share/nginx/html;
    index  index.html;

    # ── gzip 压缩：显著减小传输体积 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── 安全响应头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── SPA 路由回退：所有未匹配的路径都返回 index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Vite 构建产物（带内容 hash，可长期缓存）──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── index.html 禁止缓存：确保用户拿到最新版本入口 ──
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ── 静态图片/字体等（中等缓存）──
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── 健康检查端点（供 docker-compose healthcheck 使用）──
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── 错误页回退到 SPA（避免 404 白屏）──
    error_page 404 /index.html;
}
